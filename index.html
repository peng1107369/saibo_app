<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Koil · 铸钥</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#07070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #07070d;
            color: #b0f0ff;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            overflow: hidden;
            /* 隐藏滚动条，全屏APP风格 */
            display: flex;
            flex-direction: column;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* ===== 启动闪屏（保留，但时序已改） ===== */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #07070d;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1.2s ease;
            overflow: hidden;
        }
        #splashScreen.hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
        }
        .splash-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 20px;
            opacity: 0;
            animation: contentFadeIn 1s ease 0.3s forwards;
        }
        @keyframes contentFadeIn {
            to {
                opacity: 1;
            }
        }
        .brand-text {
            font-size: clamp(72px, 18vw, 140px);
            font-weight: 900;
            font-family: 'Arial Black', 'Impact', sans-serif;
            letter-spacing: 6px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4), 0 0 30px rgba(0, 240, 255, 0.2), 0 0 60px rgba(150, 0, 255, 0.3);
            animation: textGlitch 2.5s infinite, textFlow 3s infinite alternate;
        }
        @keyframes textGlitch {
            0%,
            90%,
            100% {
                transform: translate(0);
                opacity: 1;
            }
            92% {
                transform: translate(-2px, 1px) skewX(0.5deg);
            }
            94% {
                transform: translate(2px, -1px) skewX(-0.5deg);
            }
            96% {
                transform: translate(-1px, 1px);
            }
            98% {
                transform: translate(1px, -1px);
            }
        }
        @keyframes textFlow {
            0% {
                text-shadow: 0 0 10px rgba(0, 240, 255, 0.4), 0 0 30px rgba(0, 240, 255, 0.2), 0 0 60px rgba(150, 0, 255, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 240, 255, 0.8), 0 0 60px rgba(0, 240, 255, 0.5), 0 0 100px rgba(150, 0, 255, 0.6);
            }
            100% {
                text-shadow: 0 0 10px rgba(0, 240, 255, 0.4), 0 0 30px rgba(0, 240, 255, 0.2), 0 0 60px rgba(150, 0, 255, 0.3);
            }
        }
        .brand-phonetic {
            font-size: 20px;
            color: rgba(180, 180, 255, 0.6);
            letter-spacing: 8px;
            margin-top: -8px;
            font-family: 'Courier New', monospace;
        }
        .battery-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 280px;
            max-width: 80vw;
        }
        .battery-frame {
            position: relative;
            width: 100%;
            height: 28px;
            background: rgba(0, 20, 30, 0.6);
            border: 2px solid #00f0ff;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.05);
            overflow: hidden;
            padding: 2px;
        }
        .battery-frame::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 14px;
            background: #00f0ff;
            border-radius: 0 6px 6px 0;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
        .battery-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00aaff, #aa66ff);
            border-radius: 30px;
            position: relative;
            transition: width 0.15s linear;
            box-shadow: inset 0 0 20px rgba(0, 200, 255, 0.3);
            overflow: hidden;
        }
        .battery-fluid {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(90deg,
                    transparent 0px,
                    rgba(255, 255, 255, 0.15) 2px,
                    transparent 6px,
                    rgba(0, 255, 255, 0.1) 8px,
                    transparent 12px);
            animation: fluidFlow 1.2s linear infinite;
        }
        @keyframes fluidFlow {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        .battery-code-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: rgba(0, 255, 200, 0.15);
            overflow: hidden;
            pointer-events: none;
            white-space: nowrap;
            line-height: 28px;
            letter-spacing: 4px;
        }
        .battery-label {
            font-size: 14px;
            color: rgba(180, 200, 255, 0.7);
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
        }
        .battery-percent {
            font-size: 22px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            font-family: 'Courier New', monospace;
        }
        #energyBurstContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }
        .burst-particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #00f0ff, #aa66ff);
            box-shadow: 0 0 20px #00f0ff;
            animation: burstFly 1s ease-out forwards;
        }
        @keyframes burstFly {
            0% {
                transform: translate(0, 0) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* ===== 主页面容器 ===== */
        #appContainer {
            display: none;
            /* 闪屏结束后显示 */
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 70px;
            /* 给底部导航留空间 */;
        }
        #appContainer.active {
            display: flex;
        }

        /* ===== 页面内容区域 ===== */
        .page-content {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .page-content.active {
            display: flex;
        }

        /* ===== 首页：球体 + 输入框 ===== */
        #pageHome .sphere-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 30px;
            margin-top: -20px;
        }

        /* ---- 球体组件 ---- */
        .globe-container {
            width: 260px;
            height: 260px;
            position: relative;
            perspective: 600px;
        }
        .globe {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(0, 200, 255, 0.15), rgba(10, 10, 30, 0.6));
            backdrop-filter: blur(6px);
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.15), inset 0 0 60px rgba(0, 255, 255, 0.05);
            position: relative;
            animation: globeBreath 3s ease-in-out infinite alternate, globeSpin 20s linear infinite;
            transform-style: preserve-3d;
            overflow: hidden;
        }
        /* 球体呼吸 */
        @keyframes globeBreath {
            0% {
                transform: scale(0.98);
                box-shadow: 0 0 40px rgba(0, 255, 255, 0.1), inset 0 0 40px rgba(0, 255, 255, 0.02);
            }
            100% {
                transform: scale(1.02);
                box-shadow: 0 0 80px rgba(0, 255, 255, 0.25), inset 0 0 80px rgba(0, 255, 255, 0.08);
            }
        }
        /* 球体自转 */
        @keyframes globeSpin {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        /* 球体内部的闪电特效（用SVG或canvas绘制，这里用纯CSS模拟立体闪电） */
        .lightning-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
        }
        .lightning {
            position: absolute;
            width: 2px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.9), rgba(100, 200, 255, 0.3));
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 0 40px rgba(100, 200, 255, 0.2);
            animation: lightningFlash 0.5s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }
        @keyframes lightningFlash {
            0% {
                opacity: 0.3;
                transform: scaleY(0.8);
            }
            100% {
                opacity: 1;
                transform: scaleY(1.2);
            }
        }

        /* 球体上叠加的网格线（赛博风） */
        .globe-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background:
                repeating-linear-gradient(0deg, rgba(0, 255, 255, 0.06) 0px, rgba(0, 255, 255, 0.06) 1px, transparent 1px, transparent 12px),
                repeating-linear-gradient(90deg, rgba(255, 0, 255, 0.04) 0px, rgba(255, 0, 255, 0.04) 1px, transparent 1px, transparent 12px);
            animation: gridRotate 30s linear infinite;
        }
        @keyframes gridRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 球体加速状态 */
        .globe.speed-up {
            animation: globeBreath 1.5s ease-in-out infinite alternate, globeSpin 4s linear infinite !important;
        }
        .globe.speed-up .lightning {
            animation-duration: 0.15s !important;
        }

        /* ---- 能量数字显示 ---- */
        .energy-display {
            font-size: 48px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            text-align: center;
            min-height: 60px;
            transition: all 0.3s;
        }
        .energy-display.burning {
            color: #ff6644;
            text-shadow: 0 0 40px rgba(255, 100, 68, 0.5);
            animation: energyPulse 0.3s ease-in-out infinite alternate;
        }
        @keyframes energyPulse {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.03);
            }
        }

        /* ---- 输入框 + 按钮 ---- */
        .code-input-wrapper {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 360px;
            align-items: center;
        }
        .code-input-wrapper input {
            flex: 1;
            background: rgba(0, 20, 30, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #fff;
            padding: 12px 16px;
            border-radius: 30px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        .code-input-wrapper input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        .code-input-wrapper .btn-start {
            background: linear-gradient(135deg, #00ccff, #9900ff);
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.3);
            white-space: nowrap;
        }
        .code-input-wrapper .btn-start:active {
            transform: scale(0.95);
            box-shadow: 0 0 60px rgba(255, 0, 255, 0.6);
            background: #ff00ff;
        }

        /* ===== 底部导航 ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 255, 255, 0.15);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 env(safe-area-inset-bottom);
            z-index: 50;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(180, 200, 255, 0.4);
            font-size: 11px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-item .nav-icon {
            font-size: 24px;
            transition: all 0.3s;
        }
        .nav-item .nav-label {
            transition: all 0.3s;
        }
        .nav-item.active {
            color: #00f0ff;
        }
        .nav-item.active .nav-icon {
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
        }
        .nav-item.active .nav-label {
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        /* 点击电光反馈 */
        .nav-item:active {
            transform: scale(0.9);
        }
        .nav-item:active .nav-icon {
            color: #ff00ff;
            text-shadow: 0 0 60px rgba(255, 0, 255, 0.8);
        }

        /* ===== 登录弹窗 ===== */
        #loginModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #loginModal.show {
            display: flex;
        }
        .login-modal-box {
            background: rgba(10, 10, 25, 0.92);
            border: 1px solid #00f0ff;
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.15), inset 0 0 60px rgba(0, 240, 255, 0.02);
            position: relative;
        }
        .login-modal-box .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 24px;
            color: rgba(180, 200, 255, 0.4);
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
            font-family: 'Courier New', monospace;
        }
        .login-modal-box .close-btn:hover {
            color: #ff4466;
            transform: rotate(90deg);
        }
        .login-modal-box h2 {
            text-align: center;
            color: #00f0ff;
            margin-bottom: 20px;
            font-size: 24px;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        .login-modal-box .tab-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            padding-bottom: 12px;
        }
        .login-modal-box .tab-group .tab-btn {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            cursor: pointer;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            color: #6699aa;
            font-family: 'Courier New', monospace;
            background: none;
            border: none;
            font-size: 14px;
        }
        .login-modal-box .tab-group .tab-btn.active {
            background: rgba(0, 255, 255, 0.08);
            color: #00f0ff;
            border: 1px solid rgba(0, 255, 255, 0.15);
        }
        .login-modal-box .form-group {
            margin-bottom: 14px;
        }
        .login-modal-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 20, 30, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 30px;
            color: #b0f0ff;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: 0.3s;
        }
        .login-modal-box .form-group input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
        }
        .login-modal-box .form-actions {
            margin-top: 16px;
        }
        .login-modal-box .form-actions button {
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            cursor: pointer;
            background: linear-gradient(135deg, #00ccff, #9900ff);
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 204, 255, 0.2);
            transition: 0.15s;
        }
        .login-modal-box .form-actions button:active {
            transform: scale(0.96);
            box-shadow: 0 0 60px rgba(255, 0, 255, 0.5);
        }
        .login-modal-box .form-msg {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            min-height: 20px;
            color: #ffaa66;
        }
        .login-modal-box .form-msg.success {
            color: #66ffaa;
        }
        .login-modal-box .guest-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: rgba(180, 200, 255, 0.4);
            cursor: pointer;
            transition: 0.3s;
            border-top: 1px dashed rgba(255, 0, 255, 0.15);
            padding-top: 16px;
        }
        .login-modal-box .guest-link:hover {
            color: #00f0ff;
        }

        /* ===== 任务页面 ===== */
        .task-card {
            background: rgba(0, 20, 30, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .task-card .task-icon {
            font-size: 36px;
        }
        .task-card .task-title {
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
            color: #00f0ff;
        }
        .task-card .task-desc {
            font-size: 14px;
            opacity: 0.6;
        }
        .task-card .task-btn {
            margin-top: 12px;
            padding: 10px 28px;
            border-radius: 30px;
            border: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            background: linear-gradient(135deg, #00ccff, #9900ff);
            color: #fff;
        }
        .task-card .task-btn:active {
            transform: scale(0.95);
        }
        .task-card .task-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== 日志页面 ===== */
        .log-list {
            width: 100%;
            max-width: 380px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .log-item {
            background: rgba(0, 20, 30, 0.3);
            border-left: 3px solid #00f0ff;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 0 12px 12px 0;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-item .log-amount.plus {
            color: #66ffaa;
        }
        .log-item .log-amount.minus {
            color: #ff4466;
        }
        .log-item .log-time {
            opacity: 0.4;
            font-size: 11px;
        }

        /* ===== 个人中心 ===== */
        .profile-card {
            background: rgba(0, 20, 30, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 12px;
            text-align: center;
        }
        .profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00ffff, #4400aa);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 12px;
        }
        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 16px;
        }
        .profile-stats .stat-item {
            text-align: center;
        }
        .profile-stats .stat-item .stat-num {
            font-size: 22px;
            font-weight: bold;
            color: #00f0ff;
        }
        .profile-stats .stat-item .stat-label {
            font-size: 11px;
            opacity: 0.4;
        }
        .badge-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;

    <!-- ============================================================ -->
    <!-- JavaScript -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        //  📦 Koil · 铸钥  —— 完整 JavaScript
        //  全部功能：闪屏、球体、导航、登录弹窗、能量逻辑
        // ================================================================

        // ---------- 工具函数 ----------
        function getUsers() {
            const data = localStorage.getItem('koil_users');
            return data ? JSON.parse(data) : {};
        }

        function saveUsers(usersObj) {
            localStorage.setItem('koil_users', JSON.stringify(usersObj));
        }

        function getCurrentUser() {
            return localStorage.getItem('koil_current_user') || null;
        }

        function setCurrentUser(phone) {
            if (phone) localStorage.setItem('koil_current_user', phone);
            else localStorage.removeItem('koil_current_user');
        }

        function getCurrentUserData() {
            const phone = getCurrentUser();
            if (!phone) return null;
            const users = getUsers();
            return users[phone] || null;
        }

        function saveCurrentUserData(data) {
            const phone = getCurrentUser();
            if (!phone) return;
            const users = getUsers();
            users[phone] = data;
            saveUsers(users);
        }

        function generateNickname() {
            const p = ['赛博', '霓虹', '量子', '脉冲', '星云', '虚空', '以太', '幻影'];
            const s = ['觉醒者', '燃境', '行者', '骑士', '领主', '先驱', '主宰', '幽灵'];
            return p[Math.floor(Math.random() * p.length)] + s[Math.floor(Math.random() * s.length)];
        }

        // ---------- 预设代码 ----------
        const CODE_MAP = {
            'abc123': 100,
            'cyber2026': 50,
            'neon666': 200,
            'code999': 30,
            'koil2026': 50 // 限时代码
        };

        // ================================================================
        //  启动闪屏
        // ================================================================
        let splashTimer = null;

        function showSplash() {
            const splash = document.getElementById('splashScreen');
            const batteryFill = document.getElementById('batteryFill');
            const batteryPercent = document.getElementById('batteryPercent');
            const batteryCodeRain = document.getElementById('batteryCodeRain');

            function generateCodeRain() {
                let codeStr = '';
                for (let i = 0; i < 40; i++) {
                    codeStr += Math.random() > 0.5 ? '1' : '0';
                }
                batteryCodeRain.textContent = codeStr;
                setTimeout(generateCodeRain, 300);
            }
            generateCodeRain();

            let charge = 0;
            const chargeStep = 0.6 + Math.random() * 0.5;
            const chargeInterval = 50;

            if (splashTimer) clearInterval(splashTimer);

            splashTimer = setInterval(() => {
                charge = Math.min(charge + chargeStep, 100);
                batteryFill.style.width = charge + '%';
                batteryPercent.textContent = Math.floor(charge) + '%';

                if (charge >= 100) {
                    clearInterval(splashTimer);
                    splashTimer = null;
                    triggerEnergyBurst();

                    setTimeout(() => {
                        splash.classList.add('hide');
                        setTimeout(() => {
                            splash.style.display = 'none';
                            // 显示主应用
                            document.getElementById('appContainer').classList.add('active');
                            // 初始化应用
                            initApp();
                        }, 800);
                    }, 600);
                }
            }, chargeInterval);
        }

        function triggerEnergyBurst() {
            const container = document.getElementById('energyBurstContainer');
            const colors = ['#00f0ff', '#aa66ff', '#ff44aa', '#00ffaa'];
            for (let i = 0; i < 60; i++) {
                const particle = document.createElement('div');
                particle.className = 'burst-particle';
                const size = 4 + Math.random() * 12;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = `0 0 ${size}px ${particle.style.background}`;
                const angle = Math.random() * Math.PI * 2;
                const dist = 80 + Math.random() * 400;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.left = '50%';
                particle.style.top = '50%';
                particle.style.transform = 'translate(-50%, -50%)';
                particle.style.animationDuration = (0.6 + Math.random() * 0.6) + 's';
                container.appendChild(particle);
                setTimeout(() => particle.remove(), 1500);
            }
        }

        // ================================================================
        //  球体闪电特效（纯CSS+JS）
        // ================================================================
        let lightningInterval = null;

        function generateLightning() {
            const container = document.getElementById('lightningContainer');
            container.innerHTML = '';
            const count = 18 + Math.floor(Math.random() * 12);
            for (let i = 0; i < count; i++) {
                const bolt = document.createElement('div');
                bolt.className = 'lightning';
                const angle = Math.random() * Math.PI * 2;
                const radius = 60 + Math.random() * 40;
                const x = 50 + Math.cos(angle) * radius * 0.4;
                const y = 50 + Math.sin(angle) * radius * 0.4;
                const len = 20 + Math.random() * 50;
                const rot = Math.atan2(Math.sin(angle) * radius * 0.4, Math.cos(angle) * radius * 0.4) * (180 / Math.PI);
                bolt.style.left = x + '%';
                bolt.style.top = y + '%';
                bolt.style.height = len + 'px';
                bolt.style.transform = `translate(-50%, -100%) rotate(${rot + 90}deg)`;
                bolt.style.animationDelay = (Math.random() * 0.8) + 's';
                bolt.style.animationDuration = (0.2 + Math.random() * 0.4) + 's';
                bolt.style.width = (1 + Math.random() * 3) + 'px';
                bolt.style.opacity = 0.3 + Math.random() * 0.5;
                container.appendChild(bolt);
            }
        }

        function startLightning() {
            if (lightningInterval) clearInterval(lightningInterval);
            generateLightning();
            lightningInterval = setInterval(generateLightning, 1500);
        }

        function stopLightning() {
            if (lightningInterval) {
                clearInterval(lightningInterval);
                lightningInterval = null;
            }
        }

        // ================================================================
        //  能量消耗动画
        // ================================================================
        let burnInterval = null;
        let isBurning = false;
        let burnMode = null;

        function startEnergyBurn() {
            const userData = getCurrentUserData();
            if (!userData || (userData.energy || 0) <= 0) {
                alert('⚡ 能量不足，请先兑换能量！');
                return;
            }

            if (isBurning) {
                stopEnergyBurn();
                return;
            }

            const globe = document.getElementById('mainGlobe');
            const energyDisplay = document.getElementById('energyDisplay');

            isBurning = true;
            globe.classList.add('speed-up');
            energyDisplay.classList.add('burning');

            burnInterval = setInterval(() => {
                const data = getCurrentUserData();
                if (!data || data.energy <= 0) {
                    stopEnergyBurn();
                    alert('💀 能量已耗尽！');
                    return;
                }
                const consume = 1 + Math.floor(Math.random() * 3);
                data.energy = Math.max(0, data.energy - consume);
                data.totalBurned = (data.totalBurned || 0) + consume;
                if (!data.history) data.history = [];
                data.history.push({
                    type: '燃烧',
                    detail: '能量消耗',
                    amount: '-' + consume,
                    time: new Date().toLocaleString()
                });
                saveCurrentUserData(data);
                updateEnergyDisplay();
                updateProfileStats();
                // 如果能量归零，停止
                if (data.energy <= 0) {
                    stopEnergyBurn();
                    alert('💀 能量已耗尽！');
                }
            }, 300);
        }

        function stopEnergyBurn() {
            if (burnInterval) {
                clearInterval(burnInterval);
                burnInterval = null;
            }
            isBurning = false;
            const globe = document.getElementById('mainGlobe');
            const energyDisplay = document.getElementById('energyDisplay');
            globe.classList.remove('speed-up');
            energyDisplay.classList.remove('burning');
        }

        // ================================================================
        //  更新UI
        // ================================================================
        function updateEnergyDisplay() {
            const userData = getCurrentUserData();
            const display = document.getElementById('energyDisplay');
            if (userData) {
                display.textContent = userData.energy || 0;
            } else {
                display.textContent = '0';
            }
        }

        function updateProfileStats() {
            const userData = getCurrentUserData();
            const phone = getCurrentUser();
            if (userData) {
                document.getElementById('profileEnergy').textContent = userData.energy || 0;
                document.getElementById('profileEarned').textContent = userData.totalEarned || 0;
                document.getElementById('profileBurned').textContent = userData.totalBurned || 0;
                document.getElementById('profileName').textContent = userData.nickname || generateNickname();
                document.getElementById('profilePhone').textContent = '📱 ' + (phone || '未绑定');
                const level = Math.floor((userData.energy || 0) / 100) + 1;
                document.getElementById('profileLevel').textContent = '🌱 Lv.' + level;
                // 勋章
                const badges = userData.badges || ['🌱 觉醒者'];
                if ((userData.totalEarned || 0) >= 100 && !badges.includes('💎 百能量师')) badges.push('💎 百能量师');
                if ((userData.totalBurned || 0) >= 100 && !badges.includes('🔥 燃境大师')) badges.push('🔥 燃境大师');
                if ((userData.totalEarned || 0) >= 500 && !badges.includes('👑 能量领主')) badges.push('👑 能量领主');
                userData.badges = badges;
                saveCurrentUserData(userData);
                document.getElementById('badgeList').innerHTML = badges.map(b => `<span class="badge-item">${b}</span>`).join(
                '');
            } else {
                document.getElementById('profileEnergy').textContent = '0';
                document.getElementById('profileEarned').textContent = '0';
                document.getElementById('profileBurned').textContent = '0';
                document.getElementById('profileName').textContent = '游客';
                document.getElementById('profilePhone').textContent = '未登录';
                document.getElementById('profileLevel').textContent = '🌱 Lv.0';
                document.getElementById('badgeList').innerHTML = '<span class="badge-item">👤 游客</span>';
            }
        }

        function renderLogs() {
            const userData = getCurrentUserData();
            const container = document.getElementById('logList');
            if (!userData || !userData.history || userData.history.length === 0) {
                container.innerHTML = '<div style="text-align:center;opacity:0.4;padding:30px 0;">暂无记录</div>';
                return;
            }
            container.innerHTML = userData.history.slice().reverse().map(h => `
                <div class="log-item">
                    <div><div>${h.detail || h.type}</div><div class="log-time">${h.time || ''}</div></div>
                    <div class="log-amount ${h.amount && h.amount.startsWith('+') ? 'plus' : 'minus'}">${h.amount || ''}</div>
                </div>
            `).join('');
        }

        function renderRank() {
            const users = getUsers();
            const container = document.getElementById('rankList');
            const list = Object.keys(users).map(phone => ({
                phone: phone,
                name: users[phone].nickname || phone.substring(0, 6) + '***',
                burned: users[phone].totalBurned || 0
            })).sort((a, b) => b.burned - a.burned);
            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center;opacity:0.4;padding:30px 0;">暂无数据</div>';
                return;
            }
            container.innerHTML = list.map((u, i) => `
                <div class="rank-item">
                    <div class="rank-num">#${i + 1}</div>
                    <div class="rank-name">${u.name}</div>
                    <div class="rank-energy">🔥 ${u.burned}</div>
                </div>
            `).join('');
        }

        function updateDailyTask() {
            const userData = getCurrentUserData();
            if (!userData) {
                document.getElementById('dailyTaskBtn').disabled = true;
                document.getElementById('dailyTaskBtn').style.opacity = '0.4';
                document.getElementById('dailyTaskStatus').textContent = '请先登录';
                return;
            }
            const last = userData.lastDaily || 0;
            const now = Date.now();
            const canClaim = now - last > 24 * 60 * 60 * 1000;
            const btn = document.getElementById('dailyTaskBtn');
            const status = document.getElementById('dailyTaskStatus');
            if (canClaim) {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.textContent = '🎁 领取奖励';
                status.textContent = '✅ 今日可领取';
                status.style.color = '#66ffaa';
            } else {
                btn.disabled = true;
                btn.style.opacity = '0.4';
                const remain = 24 * 60 * 60 * 1000 - (now - last);
                const hours = Math.floor(remain / (60 * 60 * 1000));
                const mins = Math.floor((remain % (60 * 60 * 1000)) / (60 * 1000));
                btn.textContent = '⏳ 冷却中';
                status.textContent = `⏰ 剩余 ${hours}小时${mins}分钟`;
                status.style.color = '#ffaa66';
            }
        }

        // ================================================================
        //  登录弹窗逻辑
        // ================================================================
        function showLoginModal(tab = 'login') {
            const modal = document.getElementById('loginModal');
            modal.classList.add('show');
            // 切换到对应tab
            document.querySelectorAll('#loginModal .tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'login') {
                document.querySelector('#loginModal .tab-btn[data-tab="login"]').classList.add('active');
                document.getElementById('modalLoginForm').style.display = 'block';
                document.getElementById('modalRegisterForm').style.display = 'none';
            } else {
                document.querySelector('#loginModal .tab-btn[data-tab="register"]').classList.add('active');
                document.getElementById('modalLoginForm').style.display = 'none';
                document.getElementById('modalRegisterForm').style.display = 'block';
            }
            document.getElementById('modalLoginMsg').textContent = '';
            document.getElementById('modalRegMsg').textContent = '';
        }

        function hideLoginModal() {
            document.getElementById('loginModal').classList.remove('show');
        }

        function setupModalAuth() {
            // Tab切换
            document.querySelectorAll('#loginModal .tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#loginModal .tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    if (this.dataset.tab === 'login') {
                        document.getElementById('modalLoginForm').style.display = 'block';
                        document.getElementById('modalRegisterForm').style.display = 'none';
                    } else {
                        document.getElementById('modalLoginForm').style.display = 'none';
                        document.getElementById('modalRegisterForm').style.display = 'block';
                    }
                    document.getElementById('modalLoginMsg').textContent = '';
                    document.getElementById('modalRegMsg').textContent = '';
                });
            });

            // 注册
            document.getElementById('modalRegisterBtn').addEventListener('click', function() {
                const phone = document.getElementById('modalRegPhone').value.trim();
                const pwd = document.getElementById('modalRegPassword').value.trim();
                const confirm = document.getElementById('modalRegConfirm').value.trim();
                const msg = document.getElementById('modalRegMsg');
                if (!phone || !pwd || !confirm) { msg.textContent = '⚠️ 请填写完整'; return; }
                if (pwd.length < 6) { msg.textContent = '⚠️ 密码至少6位'; return; }
                if (pwd !== confirm) { msg.textContent = '⚠️ 密码不一致'; return; }
                const users = getUsers();
                if (users[phone]) { msg.textContent = '❌ 手机号已注册'; return; }
                users[phone] = {
                    password: pwd,
                    energy: 0,
                    totalEarned: 0,
                    totalBurned: 0,
                    history: [],
                    nickname: generateNickname(),
                    badges: ['🌱 觉醒者'],
                    lastDaily: 0
                };
                saveUsers(users);
                msg.textContent = '✅ 注册成功！请登录';
                msg.className = 'form-msg success';
                document.getElementById('modalRegPhone').value = '';
                document.getElementById('modalRegPassword').value = '';
                document.getElementById('modalRegConfirm').value = '';
                // 切换到登录
                document.querySelector('#loginModal .tab-btn[data-tab="login"]').click();
            });

            // 登录
            document.getElementById('modalLoginBtn').addEventListener('click', function() {
                const phone = document.getElementById('modalLoginPhone').value.trim();
                const pwd = document.getElementById('modalLoginPassword').value.trim();
                const msg = document.getElementById('modalLoginMsg');
                if (!phone || !pwd) { msg.textContent = '⚠️ 请输入完整'; return; }
                const users = getUsers();
                if (!users[phone]) { msg.textContent = '❌ 账号不存在'; return; }
                if (users[phone].password !== pwd) { msg.textContent = '❌ 密码错误'; return; }
                setCurrentUser(phone);
                msg.textContent = '✅ 登录成功！';
                msg.className = 'form-msg success';
                setTimeout(() => {
                    hideLoginModal();
                    refreshAllUI();
                    document.getElementById('modalLoginPhone').value = '';
                    document.getElementById('modalLoginPassword').value = '';
                    msg.textContent = '';
                }, 600);
            });

            // 忘记密码
            document.getElementById('modalForgotPwd').addEventListener('click', function() {
                const phone = prompt('📱 输入手机号，密码将重置为 123456');
                if (!phone) return;
                const users = getUsers();
                if (!users[phone]) { alert('❌ 未注册'); return; }
                users[phone].password = '123456';
                saveUsers(users);
                alert('✅ 密码已重置为 123456');
            });

            // 游客
            document.getElementById('modalGuestEnter').addEventListener('click', function() {
                setCurrentUser('guest_' + Date.now());
                hideLoginModal();
                refreshAllUI();
                alert('🧊 游客模式，数据不会保存');
            });

            // 关闭
            document.getElementById('modalCloseBtn').addEventListener('click', hideLoginModal);
            document.getElementById('loginModal').addEventListener('click', function(e) {
                if (e.target === this) hideLoginModal();
            });

            // 回车登录/注册
            document.querySelectorAll('#loginModal input').forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        if (document.getElementById('modalLoginForm').style.display !== 'none') {
                            document.getElementById('modalLoginBtn').click();
                        } else {
                            document.getElementById('modalRegisterBtn').click();
                        }
                    }
                });
            });
        }

        // ================================================================
        //  刷新所有UI
        // ================================================================
        function refreshAllUI() {
            updateEnergyDisplay();
            updateProfileStats();
            renderLogs();
            renderRank();
            updateDailyTask();
        }

        // ================================================================
        //  导航切换
        // ================================================================
        function setupNavigation() {
            const navItems = document.querySelectorAll('.nav-item');
            const pages = {
                pageHome: document.getElementById('pageHome'),
                pageTasks: document.getElementById('pageTasks'),
                pageRank: document.getElementById('pageRank'),
                pageLog: document.getElementById('pageLog'),
                pageProfile: document.getElementById('pageProfile')
            };

            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    // 如果正在燃烧，停止
                    if (isBurning) stopEnergyBurn();

                    // 切换导航高亮
                    navItems.forEach(n => n.classList.remove('active'));
                    this.classList.add('active');

                    // 切换页面
                    const pageId = this.dataset.page;
                    Object.keys(pages).forEach(key => {
                        pages[key].classList.toggle('active', key === pageId);
                    });

                    // 刷新对应页面数据
                    if (pageId === 'pageLog') renderLogs();
                    if (pageId === 'pageRank') renderRank();
                    if (pageId === 'pageProfile') updateProfileStats();
                    if (pageId === 'pageTasks') updateDailyTask();
                });
            });
        }

        // ================================================================
        //  核心交互：开始按钮
        // ================================================================
        function setupStartButton() {
            document.getElementById('btnStart').addEventListener('click', function() {
                const code = document.getElementById('codeInput').value.trim().toLowerCase();
                const userData = getCurrentUserData();

                // 检查是否登录（游客也算未登录）
                const phone = getCurrentUser();
                const isLoggedIn = phone && !phone.startsWith('guest_');

                // 如果未登录，弹出登录弹窗
                if (!isLoggedIn) {
                    showLoginModal('login');
                    return;
                }

                // 已登录：处理代码
                if (!code) {
                    // 没有输入代码，直接触发燃烧
                    startEnergyBurn();
                    return;
                }

                // 有代码：尝试兑换
                if (CODE_MAP.hasOwnProperty(code)) {
                    const gain = CODE_MAP[code];
                    userData.energy = (userData.energy || 0) + gain;
                    userData.totalEarned = (userData.totalEarned || 0) + gain;
                    if (!userData.history) userData.history = [];
                    userData.history.push({
                        type: '兑换',
                        detail: '密钥 ' + code,
                        amount: '+' + gain,
                        time: new Date().toLocaleString()
                    });
                    saveCurrentUserData(userData);
                    refreshAllUI();
                    document.getElementById('codeInput').value = '';
                    alert('✅ 兑换成功！获得 ' + gain + ' 能量');
                } else {
                    // 无效代码，但已登录，触发燃烧
                    startEnergyBurn();
                }
            });

            // 回车触发
            document.getElementById('codeInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('btnStart').click();
                }
            });
        }

        // ================================================================
        //  任务按钮
        // ================================================================
        function setupTasks() {
            // 每日任务
            document.getElementById('dailyTaskBtn').addEventListener('click', function() {
                const userData = getCurrentUserData();
                if (!userData) { alert('请先登录'); showLoginModal('login'); return; }
                const last = userData.lastDaily || 0;
                if (Date.now() - last < 24 * 60 * 60 * 1000) {
                    alert('⏳ 今日已领取，请明天再来');
                    return;
                }
                userData.energy = (userData.energy || 0) + 20;
                userData.totalEarned = (userData.totalEarned || 0) + 20;
                userData.lastDaily = Date.now();
                if (!userData.history) userData.history = [];
                userData.history.push({ type: '任务', detail: '每日登录奖励', amount: '+20', time: new Date().toLocaleString() });
                saveCurrentUserData(userData);
                refreshAllUI();
                alert('✅ 领取成功！获得 20 能量');
            });

            // 限时代码
            document.getElementById('limitedCodeBtn').addEventListener('click', function() {
                const userData = getCurrentUserData();
                if (!userData) { alert('请先登录'); showLoginModal('login'); return; }
                if (userData.usedLimitedCode) {
                    alert('⏳ 限时代码已使用过');
                    return;
                }
                userData.energy = (userData.energy || 0) + 50;
                userData.totalEarned = (userData.totalEarned || 0) + 50;
                userData.usedLimitedCode = true;
                if (!userData.history) userData.history = [];
                userData.history.push({ type: '兑换', detail: '限时代码 koil2026', amount: '+50', time: new Date()
                        .toLocaleString() });
                saveCurrentUserData(userData);
                refreshAllUI();
                alert('✅ 兑换成功！获得 50 能量');
            });
        }

        // ================================================================
        //  个人中心按钮
        // ================================================================
        function setupProfileButtons() {
            document.getElementById('profileLoginBtn').addEventListener('click', function() {
                showLoginModal('login');
            });
            document.getElementById('profileRegisterBtn').addEventListener('click', function() {
                showLoginModal('register');
            });
            document.getElementById('profileLogoutBtn').addEventListener('click', function() {
                if (confirm('确定退出登录吗？')) {
                    setCurrentUser(null);
                    refreshAllUI();
                    alert('已退出登录');
                }
            });

            // 清空日志
            document.getElementById('clearLogBtn').addEventListener('click', function() {
                const userData = getCurrentUserData();
                if (!userData) { alert('请先登录'); return; }
                if (confirm('确定清空所有日志吗？')) {
                    userData.history = [];
                    saveCurrentUserData(userData);
                    renderLogs();
                }
            });

            // 设置开关（简单演示）
            document.getElementById('toggleSound').addEventListener('click', function() {
                this.classList.toggle('active');
                alert('🔊 音效已' + (this.classList.contains('active') ? '开启' : '关闭'));
            });
            document.getElementById('toggleTheme').addEventListener('click', function() {
                this.classList.toggle('active');
                alert('🎨 主题切换（演示功能）');
            });
        }

        // ================================================================
        //  初始化
        // ================================================================
        function initApp() {
            // 启动闪电
            startLightning();

            // 初始化UI
            refreshAllUI();

            // 设置导航
            setupNavigation();

            // 设置开始按钮
            setupStartButton();

            // 设置任务
            setupTasks();

            // 设置个人中心
            setupProfileButtons();

            // 设置登录弹窗
            setupModalAuth();

            // 如果已登录，更新所有UI
            if (getCurrentUser()) {
                refreshAllUI();
            }

            console.log('✅ Koil · 铸钥 加载完成！');
            console.log('💡 输入密钥兑换能量，点击【开始】消耗能量');
            console.log('💡 未登录时点击【开始】会弹出登录弹窗');
        }

        // ================================================================
        //  页面加载入口
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            // 先显示闪屏
            showSplash();
        });
    </script>
</body>
